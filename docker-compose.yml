services:
  db:
    image: postgres:16-alpine
    container_name: dog-walk-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dogwalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dogwalk_pw}
      POSTGRES_DB: ${POSTGRES_DB:-dogwalk}
    volumes:
      - dog_walk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dog_walk_pgdata:
